
<h2 class="sr-only">Interactive 30-step project roadmap with action buttons</h2>

<style>
.roadmap-header { margin: 0 0 1.5rem; }
.roadmap-header h2 { font-size: 22px; font-weight: 500; margin: 0 0 4px; color: var(--text-primary); }
.roadmap-header p { font-size: 14px; color: var(--text-secondary); margin: 0; }

.phase-tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.phase-tab { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border); background: transparent; color: var(--text-secondary); transition: all 0.15s ease; }
.phase-tab:hover { border-color: var(--border-strong); color: var(--text-primary); }
.phase-tab.active { background: var(--bg-accent); color: var(--text-accent); border-color: var(--border-accent); }

.filter-row { display: flex; gap: 6px; margin-bottom: 1.5rem; align-items: center; flex-wrap: wrap; }
.filter-label { font-size: 12px; color: var(--text-muted); margin-right: 4px; }
.filter-btn { padding: 4px 12px; border-radius: var(--radius); font-size: 12px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border); background: transparent; color: var(--text-secondary); transition: all 0.15s ease; }
.filter-btn:hover { border-color: var(--border-strong); }
.filter-btn.active { border-color: var(--border-strong); color: var(--text-primary); background: var(--surface-1); }

.timeline-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 8px; background: var(--surface-1); }
.timeline-seg { transition: all 0.3s ease; }
.timeline-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 1.5rem; }

.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
.stat-card { background: var(--surface-1); border-radius: var(--radius); padding: 12px 14px; }
.stat-label { font-size: 12px; color: var(--text-muted); margin: 0 0 2px; }
.stat-val { font-size: 20px; font-weight: 500; color: var(--text-primary); margin: 0; }

.step-list { display: flex; flex-direction: column; gap: 8px; }
.step-card { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; transition: all 0.15s ease; }
.step-card:hover { border-color: var(--border-strong); }
.step-card.expanded { border-color: var(--border-accent); }
.step-card.done { opacity: 0.55; }
.step-top { display: flex; align-items: center; gap: 10px; }
.step-check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.15s ease; font-size: 12px; color: transparent; }
.step-check.checked { background: var(--bg-accent); border-color: var(--border-accent); color: var(--text-accent); }
.step-num { font-size: 12px; color: var(--text-muted); min-width: 20px; }
.step-title { font-size: 14px; font-weight: 500; color: var(--text-primary); flex: 1; }
.step-when { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.step-who { font-size: 11px; padding: 2px 8px; border-radius: var(--radius); font-weight: 500; white-space: nowrap; }
.step-who.you { background: var(--bg-warning); color: var(--text-warning); }
.step-who.claude { background: var(--bg-accent); color: var(--text-accent); }
.step-who.us { background: var(--bg-success); color: var(--text-success); }
.step-who.ext { background: #EEEDFE; color: #534AB7; }
:root[data-mode="dark"] .step-who.ext { background: #26215C; color: #AFA9EC; }
@media (prefers-color-scheme: dark) { :root:not([data-mode="light"]) .step-who.ext { background: #26215C; color: #AFA9EC; } }
.step-detail { margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); font-size: 13px; line-height: 1.65; color: var(--text-secondary); display: none; }
.step-card.expanded .step-detail { display: block; }
.step-detail .deliverable { margin-top: 8px; padding: 8px 12px; background: var(--surface-1); border-radius: var(--radius); font-size: 12px; color: var(--text-primary); }
.step-detail .deliverable span { color: var(--text-muted); }
.step-action { margin-top: 10px; display: flex; gap: 8px; }
.step-action button { padding: 6px 14px; border-radius: var(--radius); font-size: 12px; font-weight: 500; cursor: pointer; border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-primary); transition: all 0.12s ease; }
.step-action button:hover { background: var(--surface-1); }
.step-action .do-btn { background: var(--bg-accent); color: var(--text-accent); border-color: var(--border-accent); }
.step-action .do-btn:hover { opacity: 0.85; }
.chevron { font-size: 14px; color: var(--text-muted); transition: transform 0.15s ease; }
.step-card.expanded .chevron { transform: rotate(90deg); }
</style>

<div class="roadmap-header">
  <h2>the-book-was-open</h2>
  <p>30 steps — click "let's do this" to kick one off</p>
</div>

<div class="phase-tabs" id="tabs"></div>

<div class="filter-row">
  <span class="filter-label">show:</span>
  <button class="filter-btn active" data-who="all">all</button>
  <button class="filter-btn" data-who="you">solo</button>
  <button class="filter-btn" data-who="claude">claude</button>
  <button class="filter-btn" data-who="us">together</button>
  <button class="filter-btn" data-who="ext">external</button>
</div>

<div class="timeline-bar" id="timeline"></div>
<div class="timeline-label"><span>aug 2026</span><span>aug 2027</span></div>

<div class="stats-row" id="stats"></div>

<div class="step-list" id="steps"></div>

<script>
const phases = [
  { id: 'harden', label: 'Harden', color: '#534AB7', span: 2 },
  { id: 'extend', label: 'Extend for SLP', color: '#1D9E75', span: 4 },
  { id: 'validate', label: 'Validate', color: '#D85A30', span: 3 },
  { id: 'ready', label: 'Show up ready', color: '#378ADD', span: 3 }
];

const steps = [
  { n:1, phase:'harden', title:'Read your own code — on paper', when:'sep wk 1', who:'you',
    desc:'Trace a FOK buy through can_fill() → submit() → match_order() by hand. Draw the book state at each step. Do the same for an IOC partial fill across two levels.',
    deliv:'Nothing. This is for you.',
    prompt:'I\'ve read through my matching engine code on paper. Quiz me on how a FOK buy order flows through the system to check if I actually understand it.' },
  { n:2, phase:'harden', title:'Add self-trade prevention', when:'sep wk 1-2', who:'us',
    desc:'Add a trader_id field to Order and a configurable STP mode: CANCEL_NEWEST, CANCEL_OLDEST, CANCEL_BOTH. Emit a new STPCancel event when it fires.',
    deliv:'Code + 4-5 tests',
    prompt:'Let\'s build self-trade prevention for the matching engine. Add trader_id to Order and STP modes: CANCEL_NEWEST, CANCEL_OLDEST, CANCEL_BOTH.' },
  { n:3, phase:'harden', title:'Add L2 market depth', when:'sep wk 2-3', who:'us',
    desc:'Expose depth(int levels) on Book — top N price levels with aggregated qty per side. Update CLI with a --depth N flag.',
    deliv:'MarketDepth struct, CLI flag, 3-4 tests',
    prompt:'Let\'s add L2 market depth to the matching engine. Add a depth(int levels) method to Book and a --depth flag to the CLI.' },
  { n:4, phase:'harden', title:'Add GTC/GTD order types', when:'sep wk 3', who:'claude',
    desc:'Good-till-cancel and good-till-date orders. GTC rests indefinitely, GTD has an expiry timestamp and gets auto-cancelled. Requires a sweep method on Book.',
    deliv:'OrderType additions, expiry logic, sweep(), 4 tests',
    prompt:'Add GTC and GTD order types to the matching engine. GTD needs expiry timestamps and a sweep method to auto-cancel expired orders.' },
  { n:5, phase:'harden', title:'Build structured logging', when:'sep wk 3', who:'claude',
    desc:'A LogSink that writes events as structured JSON lines — timestamp, event type, all fields. Add a --json flag to the CLI.',
    deliv:'json_sink.h, CLI flag, sample output',
    prompt:'Build a structured JSON logging sink for the matching engine. Add a --json flag to the CLI that outputs events as JSON lines.' },
  { n:6, phase:'harden', title:'Write edge-case tests yourself', when:'sep wk 3-4', who:'you',
    desc:'10K orders at same price then cancel the middle one. FOK needing exactly the full book. Market order hitting 100 levels with 1 share each. 15+ new tests.',
    deliv:'Expanded test_matching.cpp, 50+ total tests',
    prompt:'I want to write edge-case tests for the matching engine myself. Give me a list of 15 tricky scenarios I should test, but don\'t write the code — just describe what each test should verify.' },
  { n:7, phase:'harden', title:'Add fuzz testing', when:'oct wk 1', who:'claude',
    desc:'A fuzzer that generates random order sequences and checks invariants after every operation: no crossed book, quantity conservation, index consistency.',
    deliv:'tests/fuzz_book.cpp, CI integration',
    prompt:'Build a fuzz tester for the matching engine that generates random order sequences and checks invariants (no crossed book, qty conservation, index consistency) after every op.' },
  { n:8, phase:'harden', title:'Add code quality badge', when:'early oct', who:'you',
    desc:'Set up SonarCloud or Codacy on the repo. Get the badge green. Put it in the README.',
    deliv:'Badge in README, zero issues',
    prompt:'Walk me through setting up SonarCloud on my GitHub repo the-book-was-open and adding the badge to the README.' },
  { n:9, phase:'harden', title:'Rewrite DESIGN.md in your voice', when:'oct wk 1', who:'you',
    desc:'Rewrite it like you\'d explain the system to a friend who knows C++ but not finance. Add a "mistakes I made" section.',
    deliv:'DESIGN.md that sounds like you',
    prompt:'I\'m rewriting DESIGN.md in my own voice. Give me an outline of sections to cover and questions to answer in each section, but don\'t write it for me.' },
  { n:10, phase:'harden', title:'Generate API reference docs', when:'oct wk 2', who:'claude',
    desc:'Clean markdown API reference from the headers — every public class, method, struct, enum with usage examples.',
    deliv:'docs/API.md',
    prompt:'Generate a clean API reference doc (docs/API.md) for the matching engine from the header files. Include usage examples for each class.' },
  { n:11, phase:'harden', title:'Post for code review', when:'oct wk 2', who:'you',
    desc:'Post on r/cpp or r/algotrading looking for feedback. Be specific about what you want reviewed.',
    deliv:'Reddit post, incorporated feedback',
    prompt:'Help me draft a Reddit post for r/cpp asking for code review on my matching engine. Keep it specific about what I want feedback on.' },

  { n:12, phase:'extend', title:'Reach out to IEOR faculty', when:'oct–nov', who:'ext',
    desc:'Find 2-3 IEOR profs in market microstructure or financial engineering. Reach out via PhD students first.',
    deliv:'Emails sent, at least one conversation started',
    prompt:'Help me draft the email to IEOR faculty for SLP guidance. I need a template that\'s professional but not stiff, mentions the matching engine project, and asks about SLP supervision.' },
  { n:13, phase:'extend', title:'Define SLP scope with your guide', when:'nov–dec', who:'ext',
    desc:'Scope the SLP extension together with your guide. Options: backtester, simulator, low-latency study, or FIX gateway.',
    deliv:'1-page SLP proposal',
    prompt:'Help me write a 1-page SLP proposal for the matching engine extension. Cover the problem, proposed work, timeline, and expected deliverables.' },
  { n:14, phase:'extend', title:'SLP registration', when:'dec 2026', who:'you',
    desc:'Register during December course registration window. Both guides must be sorted.',
    deliv:'Registered SLP',
    prompt:'What do I need to have ready before SLP registration in December? Give me a checklist.' },
  { n:15, phase:'extend', title:'Build FIX protocol adapter', when:'jan 2027', who:'claude',
    desc:'Parse FIX 4.2 NewOrderSingle (35=D) → Order struct. Format ExecutionReport (35=8) from events. Just the order entry subset.',
    deliv:'fix_adapter.h/cpp, parser tests, updated README',
    prompt:'Build a FIX 4.2 protocol adapter for the matching engine. Parse NewOrderSingle into Order, format ExecutionReport from events. Just the order entry subset.' },
  { n:16, phase:'extend', title:'Add order book persistence', when:'jan–feb', who:'claude',
    desc:'Serialize book state to binary. Rebuild from event log replay. Round-trip test.',
    deliv:'snapshot.h/cpp, round-trip tests',
    prompt:'Add order book persistence to the matching engine. Serialize to binary, rebuild from event replay, and write round-trip tests.' },
  { n:17, phase:'extend', title:'Build a market simulator', when:'feb 2027', who:'us',
    desc:'Generate synthetic order flow with configurable spread, volatility, participant mix. Measure fills, slippage, queue position.',
    deliv:'sim/ directory, sample output, plots',
    prompt:'Let\'s build a market simulator that generates synthetic order flow and feeds it through the matching engine. Configurable spread, volatility, and participant mix.' },
  { n:18, phase:'extend', title:'Add Dockerized build', when:'feb 2027', who:'claude',
    desc:'Dockerfile + docker-compose for one-command build, test, benchmark. Anyone can reproduce results.',
    deliv:'Dockerfile, docker-compose.yml, docs update',
    prompt:'Add a Dockerfile and docker-compose.yml to the matching engine project. One command to build, run tests, and run the benchmark.' },
  { n:19, phase:'extend', title:'Write the SLP report', when:'mar–apr', who:'you',
    desc:'Problem statement, design decisions, implementation, testing, benchmarks, future work.',
    deliv:'SLP report, 20-30 pages',
    prompt:'Help me outline my SLP report for the matching engine. What sections should I cover, and what\'s the right level of depth for each?' },

  { n:20, phase:'validate', title:'DM exchange-infra engineers', when:'mar–apr', who:'you',
    desc:'Find 3-5 people at Tower, Graviton, DE Shaw, WorldQuant, or Indian HFT shops.',
    deliv:'5 messages sent, notes from conversations',
    prompt:'Draft a short LinkedIn message template for reaching out to exchange-infra engineers at HFT firms for feedback on my matching engine project.' },
  { n:21, phase:'validate', title:'Get an industry code review', when:'apr–may', who:'ext',
    desc:'1:1 review from someone who builds these systems professionally.',
    deliv:'Review notes, changes made',
    prompt:'I got code review feedback on my matching engine. Here are the notes: [paste notes]. Help me prioritize and implement the changes.' },
  { n:22, phase:'validate', title:'Benchmark on production hardware', when:'may 2027', who:'you',
    desc:'Bare-metal server with isolcpus, taskset, perf stat. Report IPC, cache misses, branch mispredictions.',
    deliv:'Updated benchmark with hardware-specific numbers',
    prompt:'Walk me through how to run a proper benchmark on bare metal — isolcpus, taskset, perf stat. What numbers should I collect and how do I interpret them?' },
  { n:23, phase:'validate', title:'Write a performance analysis doc', when:'may 2027', who:'claude',
    desc:'Take perf stat output and write a detailed analysis of cache misses, branch mispredictions, and optimization opportunities.',
    deliv:'docs/PERFORMANCE.md with annotated perf data',
    prompt:'Here\'s my perf stat output from the matching engine benchmark: [paste output]. Write a detailed performance analysis doc (docs/PERFORMANCE.md) explaining what the numbers mean and where optimizations would help.' },
  { n:24, phase:'validate', title:'Build a live order book visualizer', when:'may 2027', who:'claude',
    desc:'HTML page that reads the JSON event log and animates the order book in real time — bids left, asks right, trades flashing.',
    deliv:'tools/visualizer.html, sample recording',
    prompt:'Build an HTML order book visualizer that reads the JSON event log from the matching engine and animates the book in real time. Bids stacking left, asks right, trades flashing.' },

  { n:25, phase:'ready', title:'Build resume bullet points', when:'jun 2027', who:'claude',
    desc:'2-3 resume bullet variants: quant/HFT, general SDE, transcript. Precise numbers, no fluff.',
    deliv:'Resume project section, 3 variants',
    prompt:'Write 3 resume bullet point variants for the matching engine project: one for quant/HFT roles, one for general SDE, one for my SLP transcript section. Use real numbers from the benchmark.' },
  { n:26, phase:'ready', title:'Write cold outreach templates', when:'jun 2027', who:'claude',
    desc:'LinkedIn message templates for IITB alumni at target companies. Short, specific, not cringe.',
    deliv:'3 message templates',
    prompt:'Write 3 LinkedIn cold outreach message templates for reaching out to IITB alumni at quant/HFT firms. Short, specific, mention the matching engine project.' },
  { n:27, phase:'ready', title:'Generate a project showcase page', when:'jun–jul', who:'claude',
    desc:'Clean single-page site for GitHub Pages — architecture diagram, benchmark charts, code snippets.',
    deliv:'docs/index.html, GitHub Pages deploy',
    prompt:'Build a clean single-page project showcase site (docs/index.html) for the matching engine — architecture diagram, benchmark charts, code snippets. Deployable on GitHub Pages.' },
  { n:28, phase:'ready', title:'Prep for technical interviews', when:'jun–jul', who:'you',
    desc:'"Walk me through a limit buy arrival." "Why std::map?" "How does FOK atomicity work?" Practice out loud.',
    deliv:'You, being articulate about your own code',
    prompt:'Give me the 15 most likely technical interview questions about my matching engine and what a strong answer looks like for each. Don\'t give me scripts — give me the key points to hit.' },
  { n:29, phase:'ready', title:'Mock interview session', when:'jul 2027', who:'us',
    desc:'I play interviewer. 30 min of system design + code walkthrough. I push on weak spots.',
    deliv:'Polished answers to 10 likely questions',
    prompt:'Let\'s do a mock interview. You\'re a senior engineer at a quant firm interviewing me about my matching engine. Start with the first question and push on my weak spots.' },
  { n:30, phase:'ready', title:'Target the right companies', when:'jul–aug', who:'ext',
    desc:'Tower, Graviton, DE Shaw, WorldQuant, Quadeye, AlphaGrep, NSE/BSE tech.',
    deliv:'Target list with contacts, outreach started',
    prompt:'Build me a target list of 10 companies where this matching engine project would be relevant for placement. For each, find what roles they typically hire for from IITs and what they look for.' }
];

let activePhase = 'all';
let activeWho = 'all';
let completed = new Set();

try {
  const saved = localStorage.getItem('lob-roadmap-v3');
  if (saved) completed = new Set(JSON.parse(saved));
} catch(e) {}

function save() {
  try { localStorage.setItem('lob-roadmap-v3', JSON.stringify([...completed])); } catch(e) {}
}

function render() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  [{ id:'all', label:'all phases' }, ...phases.map(p => ({id:p.id, label:p.label.toLowerCase()}))].forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'phase-tab' + (activePhase === t.id ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => { activePhase = t.id; render(); };
    tabsEl.appendChild(btn);
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.className = 'filter-btn' + (btn.dataset.who === activeWho ? ' active' : '');
    btn.onclick = () => { activeWho = btn.dataset.who; render(); };
  });

  const tlEl = document.getElementById('timeline');
  tlEl.innerHTML = '';
  phases.forEach(p => {
    const seg = document.createElement('div');
    seg.className = 'timeline-seg';
    seg.style.flex = p.span;
    seg.style.background = p.color;
    seg.style.opacity = (activePhase === 'all' || activePhase === p.id) ? '1' : '0.2';
    tlEl.appendChild(seg);
  });

  const total = steps.length;
  const doneCount = completed.size;
  const claudeN = steps.filter(s => s.who === 'claude').length;
  const youN = steps.filter(s => s.who === 'you').length;
  const usN = steps.filter(s => s.who === 'us').length;
  const extN = steps.filter(s => s.who === 'ext').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><p class="stat-label">completed</p><p class="stat-val">${doneCount}/${total}</p></div>
    <div class="stat-card"><p class="stat-label">claude does</p><p class="stat-val">${claudeN}</p></div>
    <div class="stat-card"><p class="stat-label">together</p><p class="stat-val">${usN}</p></div>
    <div class="stat-card"><p class="stat-label">you solo</p><p class="stat-val">${youN}</p></div>
    <div class="stat-card"><p class="stat-label">external</p><p class="stat-val">${extN}</p></div>
  `;

  const listEl = document.getElementById('steps');
  listEl.innerHTML = '';
  let visible = activePhase === 'all' ? steps : steps.filter(s => s.phase === activePhase);
  if (activeWho !== 'all') visible = visible.filter(s => s.who === activeWho);

  visible.forEach(s => {
    const card = document.createElement('div');
    card.className = 'step-card' + (completed.has(s.n) ? ' done' : '');
    const whoLabels = { you:'solo', claude:'claude', us:'together', ext:'external' };
    card.innerHTML = `
      <div class="step-top">
        <div class="step-check ${completed.has(s.n)?'checked':''}" data-n="${s.n}"><i class="ti ti-check" aria-hidden="true"></i></div>
        <span class="step-num">${s.n}</span>
        <span class="step-title">${s.title}</span>
        <span class="step-who ${s.who}">${whoLabels[s.who]}</span>
        <span class="step-when">${s.when}</span>
        <span class="chevron"><i class="ti ti-chevron-right" aria-hidden="true"></i></span>
      </div>
      <div class="step-detail">
        ${s.desc}
        <div class="deliverable"><span>deliverable:</span> ${s.deliv}</div>
        <div class="step-action">
          <button class="do-btn" onclick="event.stopPropagation(); sendPrompt('${s.prompt.replace(/'/g, "\\'")}')">let's do this <i class="ti ti-arrow-right" aria-hidden="true" style="font-size:12px; vertical-align:-1px; margin-left:2px"></i></button>
        </div>
      </div>
    `;
    card.querySelector('.step-check').onclick = (e) => {
      e.stopPropagation();
      if (completed.has(s.n)) completed.delete(s.n); else completed.add(s.n);
      save(); render();
    };
    card.onclick = (e) => {
      if (e.target.closest('.step-action')) return;
      card.classList.toggle('expanded');
    };
    listEl.appendChild(card);
  });
}

render();
</script>
